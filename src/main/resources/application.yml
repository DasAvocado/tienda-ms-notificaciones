server:
  port: 8084

spring:
  application:
    name: ms-notificaciones
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
  # SMTP: NO se define aqui. Si exportas SPRING_MAIL_HOST (+ PORT, USERNAME, PASSWORD) se envian
  # correos reales; si no existe, el servicio funciona en modo SIMULADO (registra el correo en el log).
  # Ejemplo Mailtrap/Gmail: ver .env.example en la raiz del proyecto.

app:
  azure:
    tenant-id: ${AZURE_TENANT_ID:d276cca8-e687-4f20-8984-601387d11401}
    client-id: ${AZURE_CLIENT_ID:39a9591b-35f1-4165-8cf2-667a2c643920}
  security:
    require-roles: ${REQUIRE_ROLES:true}
    # false = permite llamar POST /api/notificaciones/enviar desde Postman SIN token (solo pruebas).
    enabled: ${SECURITY_ENABLED:true}
  mail:
    from: ${MAIL_FROM:no-reply@pedidos360.local}
    # El UPN de Entra (usuario@tenant.onmicrosoft.com) normalmente no es un buzon real.
    # Si defines NOTIFY_OVERRIDE_TO, todos los correos de ordenes se envian a esa direccion.
    override-to: ${NOTIFY_OVERRIDE_TO:}
